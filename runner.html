<!doctype html>
<html lang="ko">
<head>

<script>
'use strict';
/* =========================================================
   NEON DASH — 횡스크롤 네온 러너
   조작: Space/↑/W 점프(공중에서 한 번 더 = 2단 점프) · ↓/S 슬라이드(공중에서는 급강하)
        P 일시정지 · M 음소거
   터치: 탭 = 점프 · 아래로 스와이프 = 슬라이드
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), hub = document.getElementById('hub');
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[(Math.random() * a.length) | 0];
const TAU = Math.PI * 2;
const FONT = 'Orbitron, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const KFONT = '"Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

/* 물리 상수 (월드 단위) */
const G = 2600, JV = 920, JV2 = 840, SPD0 = 430;

/* ---------------- 화면 / 월드 스케일 ---------------- */
let W = 0, H = 0, DPR = 1, Z = 1, WW = 0, WH = 0, GY = 0, PX = 0, MAXS = 1100;
let player = null, scarf = [];
function resize() {
  const oldGY = GY;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  Z = clamp(Math.min(W / 700, H / 520), 0.45, 1.3);
  WW = W / Z; WH = H / Z;
  GY = Math.round(WH * (W < H ? 0.64 : 0.78));
  PX = Math.max(90, WW * 0.22);
  MAXS = Math.min(1100, (WW - PX) * 1.6);
  if (player && oldGY) { player.y += GY - oldGY; for (const s of scarf) s.y += GY - oldGY; }
}
addEventListener('resize', resize); resize();

/* ---------------- 사운드 (WebAudio 합성) ---------------- */
let AC = null, master = null, muted = false, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.2, f2 = null) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v = 0.3, freq = 800) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const a = noiseBuf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(50, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d);
}
const sfx = {
  jump() { tone(360, 0.13, 'square', 0.05, 760); },
  dj() { tone(620, 0.1, 'square', 0.05, 1300); tone(920, 0.18, 'triangle', 0.06, 1900); },
  land() { noise(0.09, 0.14, 700); },
  slide() { noise(0.35, 0.13, 2600); },
  coin(n) { const f = 990 * Math.pow(2, Math.min(n, 14) / 14); tone(f, 0.07, 'square', 0.035); setTimeout(() => tone(f * 1.5, 0.12, 'square', 0.03), 45); },
  nice() { tone(1200, 0.08, 'triangle', 0.08, 1800); setTimeout(() => tone(1800, 0.12, 'triangle', 0.07, 2400), 60); },
  mile() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'triangle', 0.09), i * 70)); },
  speed() { tone(220, 0.5, 'sawtooth', 0.06, 880); noise(0.6, 0.12, 4000); },
  die() { noise(1.3, 0.6, 3200); tone(240, 0.9, 'sawtooth', 0.2, 30); setTimeout(() => tone(90, 0.8, 'sine', 0.3, 25), 80); },
  start() { tone(520, 0.08, 'triangle', 0.18, 780); setTimeout(() => tone(780, 0.16, 'triangle', 0.18, 1400), 70); },
};

/* ---------------- 글로우 스프라이트 캐시 ---------------- */
const glowCache = {};
function glow(color) {
  let c = glowCache[color]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.18, color); gr.addColorStop(0.5, color + '55'); gr.addColorStop(1, color + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return glowCache[color] = c;
}
const smokeSpr = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(150,110,200,0.7)'); gr.addColorStop(1, 'rgba(40,30,70,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
})();

/* ---------------- 배경: 사전 렌더링 패럴랙스 레이어 ---------------- */
function buildLayer(o) {
  const tw = o.tw, th = o.maxH + 60, r = o.res;
  const c = document.createElement('canvas'); c.width = Math.ceil(tw * r); c.height = Math.ceil(th * r);
  const g = c.getContext('2d'); g.scale(r, r);
  let x = rand(0, 30);
  while (x < tw - 30) {
    let w = rand(o.minW, o.maxW); if (x + w > tw - 4) w = tw - 4 - x;
    const h = rand(o.minH, o.maxH), top = th - h;
    const gr = g.createLinearGradient(0, top, 0, th); gr.addColorStop(0, o.body2); gr.addColorStop(1, o.body);
    g.fillStyle = gr;
    let capW = 0, capH = 0;
    if (Math.random() < 0.4) { capW = w * rand(0.35, 0.7); capH = rand(14, 46); g.fillRect(x + (w - capW) / 2, top - capH, capW, capH + 1); }
    g.fillRect(x, top, w, h);
    // 창문
    for (let wy = top + 10; wy < th - 10; wy += o.win * 2.3)
      for (let wx = x + 6; wx < x + w - 6 - o.win; wx += o.win * 2)
        if (Math.random() < o.lit) { g.globalAlpha = rand(0.2, 0.9); g.fillStyle = pick(o.winCols); g.fillRect(wx, wy, o.win, o.win * 1.4); }
    g.globalAlpha = 1;
    // 네온 외곽선
    if (o.edge) {
      g.shadowColor = o.edge; g.shadowBlur = 10; g.strokeStyle = o.edge; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x + 0.8, th); g.lineTo(x + 0.8, top + 0.8);
      if (capW) { const cx = x + (w - capW) / 2; g.lineTo(cx, top + 0.8); g.lineTo(cx, top - capH); g.lineTo(cx + capW, top - capH); g.lineTo(cx + capW, top + 0.8); }
      g.lineTo(x + w - 0.8, top + 0.8); g.lineTo(x + w - 0.8, th); g.stroke(); g.shadowBlur = 0;
    }
    // 안테나
    if (Math.random() < o.ant) {
      const ax = x + w * rand(0.3, 0.7), ah = rand(20, 60), at = top - capH;
      g.strokeStyle = o.body2; g.lineWidth = 2; g.beginPath(); g.moveTo(ax, at); g.lineTo(ax, at - ah); g.stroke();
      g.shadowColor = '#ff2a55'; g.shadowBlur = 12; g.fillStyle = '#ff6b8b'; g.beginPath(); g.arc(ax, at - ah, 2.2, 0, TAU); g.fill(); g.shadowBlur = 0;
    }
    // 네온 간판
    if (o.signs && Math.random() < o.signs && w > 50) {
      const col = pick(['#ff3d9a', '#00e5ff', '#ffd166', '#9b5cff', '#3dffb0']);
      const vertical = Math.random() < 0.6, sw = vertical ? rand(10, 16) : w * rand(0.4, 0.7), sh = vertical ? rand(50, Math.min(140, h * 0.6)) : rand(12, 20);
      const sx = vertical ? x + (Math.random() < 0.5 ? 6 : w - 6 - sw) : x + (w - sw) / 2, sy = top + rand(16, Math.max(20, h * 0.35));
      g.shadowColor = col; g.shadowBlur = 18; g.strokeStyle = col; g.lineWidth = 2;
      g.fillStyle = 'rgba(10,4,20,0.85)'; g.fillRect(sx, sy, sw, sh); g.strokeRect(sx, sy, sw, sh);
      g.fillStyle = col; g.globalAlpha = 0.85;
      if (vertical) for (let yy = sy + 6; yy < sy + sh - 8; yy += 12) g.fillRect(sx + 3, yy, sw - 6, 6);
      else g.fillRect(sx + 4, sy + sh / 2 - 2, sw - 8, 4);
      g.globalAlpha = 1; g.shadowBlur = 0;
    }
    x += w + rand(o.gapMin, o.gapMax);
  }
  return { c, tw, th, f: o.f };
}
const LAYERS = [
  buildLayer({ tw: 1800, res: 1, f: 0.1, minW: 50, maxW: 130, minH: 160, maxH: 400, body: '#160b33', body2: '#1f1245', edge: '#3d2a85', win: 3, lit: 0.12, winCols: ['#8c7cff', '#5f4bd6'], ant: 0.3, signs: 0, gapMin: -10, gapMax: 10 }),
  buildLayer({ tw: 1900, res: 1.25, f: 0.28, minW: 60, maxW: 150, minH: 110, maxH: 310, body: '#0d0722', body2: '#1a0f38', edge: '#ff3d9a', win: 4, lit: 0.2, winCols: ['#7df9ff', '#ff8fd0', '#ffd166'], ant: 0.25, signs: 0.25, gapMin: 4, gapMax: 40 }),
  buildLayer({ tw: 2000, res: 1.5, f: 0.55, minW: 80, maxW: 190, minH: 70, maxH: 230, body: '#06030e', body2: '#120a26', edge: '#00e5ff', win: 5, lit: 0.16, winCols: ['#7df9ff', '#ff3d9a', '#ffe08a'], ant: 0.15, signs: 0.55, gapMin: 30, gapMax: 120 }),
];
const sunSpr = (() => {
  const S = 360, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), r = S / 2;
  const gr = g.createLinearGradient(0, 0, 0, S); gr.addColorStop(0, '#ffe66d'); gr.addColorStop(0.5, '#ff7b54'); gr.addColorStop(1, '#ff2e88');
  g.fillStyle = gr; g.beginPath(); g.arc(r, r, r - 2, 0, TAU); g.fill();
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 9; i++) { const y = r + 8 + i * i * 2.4 + i * 8, hgt = 2 + i * 1.3; g.fillRect(0, y, S, hgt); }
  return c;
})();
const stars = []; for (let i = 0; i < 150; i++) stars.push({ x: Math.random(), y: Math.random(), z: rand(0.2, 1), tw: rand(0, TAU) });

/* ---------------- 상태 ---------------- */
let state = 'title', hi = 0, paused = false;
try { hi = +localStorage.getItem('neon_dash_hi') || 0; } catch (e) {}
let obs = [], coins = [], parts = [], rings = [], texts = [], debris = [], trail = [], lines = [];
let dist = 0, startDist = 0, spd = 320, nextX = 0, gameT = 0, score = 0, shownScore = 0, bonus = 0, coinsN = 0, coinChain = 0, coinChainT = 0;
let mileNext = 100, speedLvl = 1, nextSpeedT = 20, newRecord = false, deadT = 0, gameOverT = 0, topSpd = 0, demoT = 1.5;
let shake = 0, flash = 0, flashColor = '#ffffff', hitStop = 0, timeScale = 1, slowT = 0, banner = null, clock = 0, boostT = 0;
let camZ = 1, camTarget = 1, camFY = 0, camFYT = 0;

function newPlayer() {
  player = { y: GY, vy: 0, onGround: true, jumps: 0, coyote: 0, buffer: 0, slideT: 0, sy: 1, sv: 0, phase: 0, flipT: 0, dead: false, trailT: 0 };
  scarf = []; for (let i = 0; i < 8; i++) scarf.push({ x: -i * 6, y: GY - 40 });
}
newPlayer();
for (let i = 0; i < 46; i++) lines.push({ x: rand(0, 1), y: rand(0, 1), len: rand(40, 160), s: rand(1.2, 2.6) });

function reset() {
  obs = []; coins = []; parts = []; rings = []; texts = []; debris = []; trail = [];
  startDist = dist; gameT = 0; score = 0; shownScore = 0; bonus = 0; coinsN = 0; coinChain = 0; coinChainT = 0;
  mileNext = 100; speedLvl = 1; nextSpeedT = 20; newRecord = false; deadT = 0; topSpd = 0;
  shake = 0; hitStop = 0; slowT = 0; timeScale = 1; camTarget = 1; boostT = 0;
  spd = Math.max(spd, 360);
  nextX = dist + WW - PX + SPD0 * 0.6;
  newPlayer();
}
function start() {
  reset(); state = 'play'; paused = false; sfx.start();
  flash = 0.35; flashColor = '#7df9ff';
  banner = { text: 'GO!', sub: '네온 시티를 질주하라', t: 0, dur: 1.6 };
  rings.push({ x: dist, y: GY - 25, r: 8, max: 140, life: 0.5, t: 0, color: '#7df9ff', w: 6, vx: spd });
}

/* ---------------- 입력 ---------------- */
const keys = {};
const isJumpKey = c => c === 'Space' || c === 'ArrowUp' || c === 'KeyW';
const isDownKey = c => c === 'ArrowDown' || c === 'KeyS';
addEventListener('keydown', e => {
  keys[e.code] = true; initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (state === 'title') { if (isJumpKey(e.code) || e.code === 'Enter') start(); return; }
  if (state === 'over') { if ((isJumpKey(e.code) || e.code === 'Enter') && gameOverT > 0.9) start(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { paused = !paused; return; }
  if (paused) return;
  if (isJumpKey(e.code)) jump();
  else if (isDownKey(e.code)) slide();
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (isJumpKey(e.code)) jumpCut();
});
function autoPause() { if (state === 'play' && !player.dead) paused = true; for (const k in keys) keys[k] = false; touch = null; }
addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

let touch = null;
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state === 'title') { start(); return; }
  if (state === 'over') { if (gameOverT > 0.9) start(); return; }
  if (paused) { paused = false; return; }
  if (touch && !touch.used) jump();
  touch = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), used: false };
});
addEventListener('pointermove', e => {
  if (!touch || e.pointerId !== touch.id || touch.used) return;
  const dy = e.clientY - touch.y;
  if (dy > 28) { touch.used = true; slide(); }
  else if (dy < -28) { touch.used = true; jump(); }
});
addEventListener('pointerup', e => {
  if (!touch || e.pointerId !== touch.id) return;
  if (!touch.used) jump();
  touch = null;
});
addEventListener('pointercancel', () => touch = null);
function checkTouchHold() {
  // 손가락을 움직이지 않고 누르고 있으면 짧은 지연 후 점프 (스와이프와 구분)
  if (touch && !touch.used && performance.now() - touch.t > 95) { touch.used = true; jump(); }
}

/* ---------------- 이펙트 ---------------- */
function addPart(x, y, vx, vy, life, size, color, kind = 0, drag = 0.96, g = 0) {
  if (parts.length > 1800) return;
  parts.push({ x, y, vx, vy, life, max: life, size, color, kind, drag, g });
}
// kind: 0 스파크(선), 1 화염구, 2 연기, 3 섬광, 4 글로우 점
function explode(x, y, color, scale = 1) {
  const n = Math.max(6, (16 * scale) | 0);
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), s = rand(80, 420) * scale; addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.25, 0.7), rand(1.5, 3), i % 3 ? color : '#ffffff', 0, 0.92); }
  for (let i = 0; i < n * 0.7; i++) { const a = rand(0, TAU), s = rand(10, 140) * scale; addPart(x + rand(-6, 6) * scale, y + rand(-6, 6) * scale, Math.cos(a) * s, Math.sin(a) * s, rand(0.4, 0.9), rand(10, 24) * scale, i % 2 ? '#ff9ad0' : '#ff3d9a', 1, 0.9); }
  for (let i = 0; i < n * 0.5; i++) { const a = rand(0, TAU), s = rand(10, 70) * scale; addPart(x, y, Math.cos(a) * s, Math.sin(a) * s - 20, rand(0.8, 1.6), rand(10, 26) * scale, '', 2, 0.95); }
  for (let i = 0; i < Math.ceil(3 * scale); i++) { const a = rand(0, TAU), s = rand(80, 280) * scale; debris.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, rot: rand(0, TAU), vr: rand(-14, 14), size: rand(3, 7) * Math.sqrt(scale), life: rand(0.6, 1.3), max: 1.3, color }); }
  rings.push({ x, y, r: 6, max: 80 * scale, life: 0.45, t: 0, color, w: 5 * Math.sqrt(scale) });
  addPart(x, y, 0, 0, 0.18, 46 * scale, '#ffffff', 3, 1);
  shake = Math.max(shake, 3 + 3 * scale);
}
// 플로팅 텍스트: 카메라 기준 좌표(뷰 좌표)
function popText(x, y, text, col = '#fff', size = 16, life = 0.9) { texts.push({ x, y, text, col, size, t: 0, life }); }

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    const dr = Math.pow(q.drag, dt * 60); q.vx *= dr; q.vy = q.vy * dr + q.g * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
  }
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.life -= dt;
    if (d.life <= 0) { debris.splice(i, 1); continue; }
    d.vx *= Math.pow(0.97, dt * 60); d.vy = d.vy * Math.pow(0.97, dt * 60) + 600 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    if (Math.random() < 0.5) addPart(d.x, d.y, 0, 0, 0.3, 4, d.color, 4, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.x += (r.vx || 0) * dt; if (r.t >= r.life) rings.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.t += dt; t.y -= 40 * dt; if (t.t >= t.life) texts.splice(i, 1); }
  for (let i = trail.length - 1; i >= 0; i--) { trail[i].t += dt; if (trail[i].t > 0.24) trail.splice(i, 1); }
}

/* ---------------- 지형 & 장애물 ---------------- */
function supported(x) {
  for (const o of obs) if (o.type === 'gap' && x - 9 > o.x && x + 9 < o.x + o.w) return false;
  return true;
}
function addObs(type, x, w, extra = {}) { obs.push(Object.assign({ type, x, w, t: rand(0, TAU), minClr: 999, done: false }, extra)); }
function coinAt(x, hy) { coins.push({ x, hy, mag: false, ph: rand(0, TAU) }); }
function coinLine(x, n, hy, sp = 34) { for (let i = 0; i < n; i++) coinAt(x + i * sp, hy); }
function coinArc(cx, n = 7) {
  const v = spd, T = 2 * JV / G;
  for (let i = 0; i < n; i++) {
    const t = (0.1 + 0.8 * i / (n - 1)) * T, h = JV * t - 0.5 * G * t * t;
    coinAt(cx - v * T / 2 + v * t, h + 26);
  }
}
function pattern(x) {

    ctx.font = `900 ${Math.min(44, W * 0.1)}px ${FONT}`; ctx.fillStyle = '#ffd166'; ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 18;
    ctx.fillText(Math.round(score * easeOutBack(k2)).toLocaleString(), W / 2, cy + fs * 0.95 + 40);
    ctx.shadowBlur = 0;
    ctx.font = `700 ${Math.min(14, W * 0.037)}px ${KFONT}`; ctx.fillStyle = '#bfe9ff';
    ctx.fillText(`거리 ${meters().toLocaleString()}m   ·   코인 ${coinsN}   ·   최고 ${Math.round(topSpd * 0.36)}km/h`, W / 2, cy + fs * 0.95 + 84);
    if (newRecord) {
      const p = 1 + Math.sin(clock * 8) * 0.08;
      ctx.save(); ctx.translate(W / 2, cy - fs * 0.9); ctx.scale(p, p);
      ctx.font = `900 20px ${FONT}`; ctx.fillStyle = `hsl(${(clock * 300) % 360},100%,65%)`; ctx.fillText('★ NEW RECORD ★', 0, 0);
      ctx.restore();
    }
    if (gameOverT > 0.9) {
      ctx.globalAlpha = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(clock * 4));
      ctx.font = `900 16px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('SPACE / TAP TO RETRY', W / 2, H * 0.8);
    }
    ctx.globalAlpha = 1;
  }
}

function render(rdt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05030f'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.scale(Z, Z);
  // 카메라 줌 (사망 시 플레이어 쪽으로 확대)
  ctx.translate(PX, camFY); ctx.scale(camZ, camZ); ctx.translate(-PX, -camFY);
  drawSky();
  LAYERS.forEach(drawLayer);
  drawGround();
  ctx.save(); ctx.translate(PX - dist, 0);
  for (const o of obs) drawObstacle(o);
  drawCoins();
  drawPlayer();
  drawFx();
  ctx.restore();
  drawSpeedLines();
  drawTexts();
  ctx.restore();
  if (slowT > 0 || (player.dead && state === 'play')) {
    const k = clamp(slowT, 0, 1) * 0.5;
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(255,0,60,0)'); vg.addColorStop(1, `rgba(255,0,60,${k})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.7; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (state === 'title') drawTitle();
  else drawHUD();
  drawBanner(paused ? 0 : rdt);
  if (state === 'over') drawGameOver();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(5,2,15,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${Math.min(52, W * 0.1)}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.shadowColor = '#ff3d9a'; ctx.shadowBlur = 20;
    ctx.fillText('PAUSED', W / 2, H * 0.45); ctx.shadowBlur = 0;
    ctx.font = `500 14px ${KFONT}`; ctx.fillStyle = '#ffd0ea'; ctx.fillText('P 키 또는 화면 터치로 계속', W / 2, H * 0.45 + 44);
  }
  if (muted) { ctx.font = `700 10px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillText('MUTED', W / 2, H - 8); }
}

/* ---------------- 메인 루프 ---------------- */
let last = performance.now(), hubShown = null;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, now - last) / 1000); last = now;
  if (slowT > 0) { slowT -= rdt; timeScale = lerp(timeScale, 0.25, 1 - Math.exp(-rdt * 12)); }
  else timeScale = lerp(timeScale, 1, 1 - Math.exp(-rdt * 4));
  let dt = rdt * timeScale;
  if (hitStop > 0) { hitStop -= rdt; dt = 0; }
  const pp = paused && state === 'play';
  if (pp) dt = 0;
  update(dt, pp ? 0 : rdt);
  render(pp ? 0 : rdt);
  const show = state !== 'play';
  if (show !== hubShown) { hubShown = show; hub.style.display = show ? '' : 'none'; }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
