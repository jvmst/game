<!doctype html>
<html lang="ko">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

  #arcade:hover{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<a id="arcade" href="index.html">◀ ARCADE</a>
<script>
'use strict';
/* =========================================================
   GEM CASCADE — 보석 매치3 타임어택 퍼즐
   조작: 클릭 두 번 또는 스와이프로 교환 · P 일시정지 · M 음소거
   4개 → 줄 폭탄 · L/T자 → 범위 폭탄 · 5개 → 컬러 폭탄
   ========================================================= */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const arcadeLink = document.getElementById('arcade');
let W = 0, H = 0, DPR = 1;
const N = 8, KINDS = 6;
let S = 60, BX = 0, BY = 0, BW = 480;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = (W * DPR) | 0; cv.height = (H * DPR) | 0;
  const avail = Math.min(W - 24, H - 210, 560);
  S = Math.max(34, Math.floor(avail / N)); BW = S * N;
  BX = Math.round((W - BW) / 2); BY = Math.round(Math.max(118, (H - BW) / 2 + 36));
  buildGemSprites();
}

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const FONT = 'Orbitron, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const KFONT = '"Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

/* ---------------- 사운드 ---------------- */
let AC = null, master = null, muted = false, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.2, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, AC.currentTime); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v = 0.3, freq = 800) {
  if (!AC || muted) return;
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(50, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d);
}
const sfx = {
  select() { tone(880, 0.06, 'sine', 0.08, 1100); },
  swap() { tone(420, 0.12, 'triangle', 0.1, 700); },
  nope() { tone(200, 0.08, 'square', 0.07, 150); tone(160, 0.1, 'square', 0.07, 120, 0.09); },
  match(ch) { const b = 523 * Math.pow(1.122, Math.min(ch - 1, 12)); tone(b, 0.14, 'triangle', 0.14); tone(b * 1.5, 0.18, 'sine', 0.08, null, 0.05); },
  land() { tone(140 + Math.random() * 40, 0.05, 'sine', 0.04); },
  special() { noise(0.6, 0.35, 3000); tone(300, 0.5, 'sawtooth', 0.1, 1600); },
  bomb() { noise(0.9, 0.5, 1800); tone(90, 0.6, 'sine', 0.3, 30); },
  create() { tone(660, 0.1, 'triangle', 0.12, 990); tone(990, 0.2, 'triangle', 0.12, 1980, 0.08); },
  tick() { tone(1500, 0.03, 'square', 0.05); },
  shuffle() { for (let i = 0; i < 6; i++) tone(400 + i * 120, 0.08, 'sine', 0.06, null, i * 0.05); },
  start() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.12, null, i * 0.08)); },
  end() { [784, 659, 523, 392].forEach((f, i) => tone(f, 0.3, 'triangle', 0.14, null, i * 0.12)); },
};

/* ---------------- 글로우 & 보석 스프라이트 ---------------- */
const glowCache = {};
function glow(color) {
  let c = glowCache[color]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.18, color); gr.addColorStop(0.5, color + '55'); gr.addColorStop(1, color + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return glowCache[color] = c;
}
const COLORS = ['#ff3d7f', '#ffb703', '#7CFF6B', '#4cc9f0', '#b388ff', '#ff8c1a'];
const LIGHT = ['#ffc2d6', '#fff0b8', '#dcffd4', '#d4f4ff', '#ece0ff', '#ffd9b0'];
const DARK = ['#7a0a33', '#7a4d00', '#1d6b12', '#0a4f73', '#4a2190', '#7a3300'];
function gemPath(g, kind, r) {
  g.beginPath();
  if (kind === 0) { g.moveTo(-0.5 * r, -0.82 * r); g.lineTo(0.5 * r, -0.82 * r); g.lineTo(0.95 * r, -0.22 * r); g.lineTo(0, 0.95 * r); g.lineTo(-0.95 * r, -0.22 * r); }
  else if (kind === 1) { g.arc(0, 0, r * 0.9, 0, TAU); }
  else if (kind === 2) { const k = r * 0.78, q = r * 0.22; g.moveTo(-k + q, -k); g.lineTo(k - q, -k); g.quadraticCurveTo(k, -k, k, -k + q); g.lineTo(k, k - q); g.quadraticCurveTo(k, k, k - q, k); g.lineTo(-k + q, k); g.quadraticCurveTo(-k, k, -k, k - q); g.lineTo(-k, -k + q); g.quadraticCurveTo(-k, -k, -k + q, -k); }
  else if (kind === 3) { g.moveTo(0, -0.95 * r); g.lineTo(0.95 * r, 0.75 * r); g.lineTo(-0.95 * r, 0.75 * r); }
  else if (kind === 4) { for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + Math.PI / 6; g.lineTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92); } }
  else { for (let i = 0; i < 10; i++) { const a = i * TAU / 10 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r * 0.98; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } }
  g.closePath();
}
let gemSpr = [];
function buildGemSprites() {
  gemSpr = [];
  const sz = Math.ceil(S * DPR * 1.2);
  for (let k = 0; k < KINDS; k++) {
    const c = document.createElement('canvas'); c.width = c.height = sz;
    const g = c.getContext('2d'); g.translate(sz / 2, sz / 2);
    const r = sz * 0.36;
    const gr = g.createLinearGradient(-r, -r, r, r);
    gr.addColorStop(0, LIGHT[k]); gr.addColorStop(0.45, COLORS[k]); gr.addColorStop(1, DARK[k]);
    gemPath(g, k, r); g.fillStyle = gr; g.fill();
    g.lineWidth = Math.max(1.5, r * 0.07); g.strokeStyle = 'rgba(255,255,255,0.55)'; g.stroke();
    // 내부 컷
    g.save(); g.scale(0.55, 0.55); gemPath(g, k, r); g.restore();
    g.fillStyle = 'rgba(255,255,255,0.16)'; g.fill();
    g.lineWidth = Math.max(1, r * 0.04); g.strokeStyle = 'rgba(255,255,255,0.35)'; g.stroke();
    // 하이라이트
    g.fillStyle = 'rgba(255,255,255,0.75)';
    g.beginPath(); g.ellipse(-r * 0.32, -r * 0.42, r * 0.22, r * 0.1, -0.6, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(r * 0.35, r * 0.25, r * 0.05, 0, TAU); g.fill();
    gemSpr.push(c);
  }
}
addEventListener('resize', resize); resize();

/* ---------------- 상태 ---------------- */
let state = 'title', hi = 0, paused = false, clock = 0;
try { hi = +localStorage.getItem('gem_cascade_hi') || 0; } catch (e) {}
let grid = [], phase = 'idle', pending = null, sel = null, drag = null, chain = 0, bestChain = 0, gemsCleared = 0, specialsUsed = 0;
let timeLeft = 60, hintT = 0, hint = null, clearT = 0, score = 0, shown = 0, newRecord = false, overT = 0, lastTick = 99, timeUp = false;
let parts = [], rings = [], texts = [], beams = [], chainFx = null, banner = null, bokeh = [], titleGems = [];
let shake = 0, flash = 0, flashColor = '#fff', uid = 0;

const cellX = c => BX + (c + 0.5) * S, cellY = r => BY + (r + 0.5) * S;
function newGem(kind, r, c, py) { return { kind, sp: null, r, c, px: c, py: py === undefined ? r : py, vy: 0, die: 0, pop: 0, wob: 0, land: 0, slide: false, id: uid++ }; }
function put(r, c, g) { grid[r][c] = g; if (g) { g.r = r; g.c = c; } }

function fillBoard(intro) {
  grid = [];
  for (let r = 0; r < N; r++) { grid.push([]); for (let c = 0; c < N; c++) {
    let k;
    do { k = (Math.random() * KINDS) | 0; } while ((c >= 2 && grid[r][c - 1].kind === k && grid[r][c - 2].kind === k) || (r >= 2 && grid[r - 1][c].kind === k && grid[r - 2][c].kind === k));
    grid[r].push(newGem(k, r, c, intro ? r - N - 2 - c * 0.35 - Math.random() * 0.3 : r));
  } }
  if (!findMove()) fillBoard(intro);
}
function start() {
  score = 0; shown = 0; chain = 0; bestChain = 0; gemsCleared = 0; specialsUsed = 0; timeLeft = 60; timeUp = false; lastTick = 99;
  parts = []; rings = []; texts = []; beams = []; chainFx = null; sel = null; drag = null; pending = null; newRecord = false;
  fillBoard(true); phase = 'anim'; state = 'play'; paused = false;
  banner = { text: 'READY... GO!', t: 0, dur: 1.6 };
  sfx.start();
}

/* ---------------- 매치 로직 ---------------- */
function findRuns() {
  const runs = [];
  for (let r = 0; r < N; r++) { let c = 0; while (c < N) {
    const g = grid[r][c]; if (!g || g.kind < 0) { c++; continue; }
    let e = c + 1; while (e < N && grid[r][e] && grid[r][e].kind === g.kind) e++;
    if (e - c >= 3) { const cells = []; for (let x = c; x < e; x++) cells.push([r, x]); runs.push({ dir: 'h', cells }); }
    c = e;
  } }
  for (let c = 0; c < N; c++) { let r = 0; while (r < N) {
    const g = grid[r][c]; if (!g || g.kind < 0) { r++; continue; }
    let e = r + 1; while (e < N && grid[e][c] && grid[e][c].kind === g.kind) e++;
    if (e - r >= 3) { const cells = []; for (let y = r; y < e; y++) cells.push([y, c]); runs.push({ dir: 'v', cells }); }
    r = e;
  } }
  return runs;
}
function swapRaw(a, b) { const ga = grid[a[0]][a[1]], gb = grid[b[0]][b[1]]; put(a[0], a[1], gb); put(b[0], b[1], ga); }
function findMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc; if (r2 >= N || c2 >= N) continue;
      if (grid[r][c].kind < 0 || grid[r2][c2].kind < 0) return [[r, c], [r2, c2]];
      swapRaw([r, c], [r2, c2]); const ok = findRuns().length > 0; swapRaw([r, c], [r2, c2]);
      if (ok) return [[r, c], [r2, c2]];
    }
  }
  return null;
}
function doShuffle() {
  let tries = 0;
  do {
    const all = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) all.push(grid[r][c]);
    for (let i = all.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [all[i], all[j]] = [all[j], all[i]]; }
    let i = 0; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) put(r, c, all[i++]);
  } while ((findRuns().length || !findMove()) && ++tries < 200);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const g = grid[r][c]; g.py = r - N - 1 - Math.random(); g.px = c; g.vy = 0; }
  banner = { text: 'SHUFFLE!', t: 0, dur: 1.2 }; sfx.shuffle(); phase = 'anim';
}

function trySwap(a, b) {
  if (phase !== 'idle' || timeUp) return;
  const ga = grid[a[0]][a[1]], gb = grid[b[0]][b[1]];
  hint = null; hintT = 0;
  sfx.swap();
  ga.slide = gb.slide = true;
  swapRaw(a, b);
  if (ga.kind < 0 || gb.kind < 0) {
    // 컬러 폭탄 교환 → 즉시 발동
    const bomb = ga.kind < 0 ? ga : gb, other = bomb === ga ? gb : ga;
    chain = 1;
    const clear = new Set([key(bomb.r, bomb.c)]);
    colorTargets(bomb, other.kind < 0 ? -1 : other.kind, clear);
    if (other.kind < 0) clear.add(key(other.r, other.c));
    bomb.sp = 'used';
    blast(clear, [], other.kind);
    return;
  }
  pending = { a: b, b: a, ga, gb };
  phase = 'anim';
}
const key = (r, c) => r * N + c;

function colorTargets(bomb, kind, clear) {
  const bx = cellX(bomb.c), by = cellY(bomb.r);
  let k = kind;
  if (k === undefined || k === null) { const cnt = new Array(KINDS).fill(0); for (const row of grid) for (const g of row) if (g && g.kind >= 0) cnt[g.kind]++; k = cnt.indexOf(Math.max(...cnt)); }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = grid[r][c]; if (!g) continue;
    if (k === -1 || g.kind === k) { clear.add(key(r, c)); beams.push({ type: 'bolt', x1: bx, y1: by, x2: cellX(c), y2: cellY(r), t: 0, life: 0.45, col: k >= 0 ? COLORS[k] : '#ffffff' }); }
  }
  flash = Math.max(flash, 0.5); flashColor = '#ffffff'; shake = Math.max(shake, 14);
  rings.push({ x: bx, y: by, r: 10, max: BW, life: 0.6, t: 0, color: '#ffffff', w: 8 });
  sfx.special(); specialsUsed++;
}

function resolve() {
  const runs = findRuns();
  if (!runs.length) {
    if (pending) {
      const { a, b, ga, gb } = pending; pending = null;
      ga.slide = gb.slide = true; ga.wob = gb.wob = 1;
      swapRaw(a, b); sfx.nope(); phase = 'anim'; return;
    }
    if (chain >= 3 && !timeUp) { timeLeft = Math.min(99, timeLeft + 1); popText(BX + BW - 30, BY - 46, '+1s', '#7CFF6B', 16); }
    chain = 0;
    if (!findMove()) { doShuffle(); return; }
    phase = 'idle'; hintT = 0; return;
  }
  const swapped = pending ? [pending.a, pending.b] : [];
  pending = null;
  chain++; bestChain = Math.max(bestChain, chain);
  const clear = new Set(), byCell = {};
  for (const run of runs) for (const [r, c] of run.cells) { const k = key(r, c); clear.add(k); (byCell[k] = byCell[k] || []).push(run); }
  const creates = [], usedRuns = new Set();
  // L/T자 → 범위 폭탄
  for (const k in byCell) {
    const rs = byCell[k];
    if (rs.some(x => x.dir === 'h') && rs.some(x => x.dir === 'v') && !rs.some(x => usedRuns.has(x))) {
      rs.forEach(x => usedRuns.add(x)); creates.push({ k: +k, sp: 'bomb' });
    }
  }
  for (const run of runs) {
    if (usedRuns.has(run) || run.cells.length < 4) continue;
    let at = run.cells[(run.cells.length / 2) | 0];
    for (const s of swapped) if (run.cells.some(([r, c]) => r === s[0] && c === s[1])) at = s;
    creates.push({ k: key(at[0], at[1]), sp: run.cells.length >= 5 ? 'color' : run.dir === 'h' ? 'row' : 'col' });
  }
  const finalCreates = [];
  for (const cr of creates) {
    const g = grid[(cr.k / N) | 0][cr.k % N];
    if (g && !g.sp) { clear.delete(cr.k); finalCreates.push({ g, sp: cr.sp }); }
  }
  blast(clear, finalCreates);
}

function blast(clear, creates, colorKind) {
  // 특수 보석 연쇄 발동
  const queue = [...clear], activated = new Set();
  while (queue.length) {
    const k = queue.shift(), r = (k / N) | 0, c = k % N, g = grid[r][c];
    if (!g || !g.sp || g.sp === 'used' || activated.has(g.id)) continue;
    activated.add(g.id);
    const add = (rr, cc) => { if (rr < 0 || cc < 0 || rr >= N || cc >= N) return; const kk = key(rr, cc); if (!clear.has(kk)) { clear.add(kk); queue.push(kk); } };
    if (g.sp === 'row') { for (let x = 0; x < N; x++) add(r, x); beams.push({ type: 'h', r, t: 0, life: 0.5, col: COLORS[g.kind] }); sfx.special(); shake = Math.max(shake, 10); specialsUsed++; }
    else if (g.sp === 'col') { for (let y = 0; y < N; y++) add(y, c); beams.push({ type: 'v', c, t: 0, life: 0.5, col: COLORS[g.kind] }); sfx.special(); shake = Math.max(shake, 10); specialsUsed++; }
    else if (g.sp === 'bomb') {
      for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) add(r + y, c + x);
      rings.push({ x: cellX(c), y: cellY(r), r: 6, max: S * 2.6, life: 0.5, t: 0, color: COLORS[g.kind], w: 10 });
      rings.push({ x: cellX(c), y: cellY(r), r: 6, max: S * 1.8, life: 0.35, t: 0, color: '#ffffff', w: 5 });
      sfx.bomb(); shake = Math.max(shake, 16); flash = Math.max(flash, 0.35); flashColor = COLORS[g.kind]; specialsUsed++;
    } else if (g.sp === 'color') {
      const tmp = new Set(); colorTargets(g, null, tmp); for (const kk of tmp) add((kk / N) | 0, kk % N);
    }
  }
  // 생성될 특수 보석이 폭발에 휘말리면 생성 취소
  creates = creates.filter(cr => !clear.has(key(cr.g.r, cr.g.c)));
  // 적용
  let sx = 0, sy = 0, n = 0;
  for (const k of clear) {
    const r = (k / N) | 0, c = k % N, g = grid[r][c]; if (!g || g.die) continue;
    g.die = 0.0001; n++;
    const x = cellX(c), y = cellY(r), col = g.kind >= 0 ? COLORS[g.kind] : '#ffffff';
    sx += x; sy += y;
    for (let i = 0; i < 9; i++) { const a = rand(0, TAU), s = rand(80, 360); addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.3, 0.7), rand(1.5, 3), i % 3 ? col : '#ffffff', 0, 0.92); }
    for (let i = 0; i < 3; i++) { const a = rand(0, TAU), s = rand(40, 160); addPart(x, y, Math.cos(a) * s, Math.sin(a) * s - 60, rand(0.5, 0.9), rand(S * 0.08, S * 0.14), col, 5, 0.95); }
    addPart(x, y, 0, 0, 0.22, S * 0.7, col, 3, 1);
    rings.push({ x, y, r: S * 0.2, max: S * 0.75, life: 0.3, t: 0, color: col, w: 3 });
  }
  for (const cr of creates) {
    cr.g.sp = cr.sp; if (cr.sp === 'color') cr.g.kind = -1;
    cr.g.pop = 1;
    const x = cellX(cr.g.c), y = cellY(cr.g.r);
    rings.push({ x, y, r: 4, max: S * 1.4, life: 0.5, t: 0, color: '#ffffff', w: 6 });
    for (let i = 0; i < 20; i++) { const a = i * TAU / 20; addPart(x, y, Math.cos(a) * 260, Math.sin(a) * 260, 0.45, 2.5, '#ffffff', 0, 0.9); }
    popText(x, y - S * 0.5, cr.sp === 'color' ? 'COLOR BOMB!' : cr.sp === 'bomb' ? 'BOMB!' : 'LINE!', '#ffffff', 15);
    if (!timeUp) timeLeft = Math.min(99, timeLeft + 1);
    sfx.create();
  }
  gemsCleared += n;
  const gain = Math.round(n * 30 * chain * (1 + (creates.length ? 0.5 : 0)));
  score += gain;

  ctx.font = `900 ${Math.min(52, W * 0.1)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255,0,120,0.7)'; ctx.fillText(banner.text, -3, 0);
  ctx.fillStyle = 'rgba(0,220,255,0.7)'; ctx.fillText(banner.text, 3, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffffff'; ctx.fillText(banner.text, 0, 0);
  ctx.restore();
}

function drawTitle() {
  for (const g of titleGems) {
    ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot);
    const sz = S * 1.2 * g.s; ctx.globalAlpha = 0.85; ctx.drawImage(gemSpr[g.k], -sz / 2, -sz / 2, sz, sz); ctx.restore();
  }
  ctx.globalAlpha = 1;
  const cy = H * 0.34, text = 'GEM CASCADE', fs = Math.min(70, W * 0.105);
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const ws = [...text].map(ch => ctx.measureText(ch).width + fs * 0.04), tot = ws.reduce((a, b) => a + b, 0);
  let x = W / 2 - tot / 2;
  [...text].forEach((ch, i) => {
    const bounce = Math.abs(Math.sin(clock * 3 - i * 0.35)), y = cy - bounce * 14;
    const col = COLORS[i % KINDS];
    ctx.save(); ctx.translate(x + ws[i] / 2, y); ctx.scale(1 + (1 - bounce) * 0.08, 1 - (1 - bounce) * 0.08);
    ctx.shadowColor = col; ctx.shadowBlur = 22; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
    ctx.fillText(ch, 0, 0); ctx.shadowBlur = 0;
    ctx.restore();
    x += ws[i];
  });
  ctx.textAlign = 'center';
  ctx.font = `700 ${Math.min(18, W * 0.045)}px ${KFONT}`; ctx.fillStyle = '#e0d4ff';
  ctx.fillText('60초 안에 보석을 최대한 터뜨려라!', W / 2, cy + fs * 0.9);
  // 특수 보석 안내
  const ix = W / 2, iy = H * 0.58, gap = Math.min(110, W * 0.26);
  const info = [['4개', '줄 폭탄'], ['L·T자', '범위 폭탄'], ['5개', '컬러 폭탄']];
  info.forEach(([a, b], i) => {
    const xx = ix + (i - 1) * gap;
    ctx.save(); ctx.translate(xx, iy);
    const sz = S * 1.1; ctx.drawImage(gemSpr[[3, 0, 4][i]], -sz / 2, -sz / 2, sz, sz);
    ctx.restore();
    ctx.font = `900 13px ${KFONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText(a, xx, iy + S * 0.75);
    ctx.font = `500 12px ${KFONT}`; ctx.fillStyle = '#bfa8ff'; ctx.fillText(b, xx, iy + S * 0.75 + 18);
  });
  const p = 0.5 + 0.5 * Math.sin(clock * 4);
  ctx.globalAlpha = 0.4 + p * 0.6; ctx.font = `900 ${Math.min(18, W * 0.045)}px ${FONT}`; ctx.fillStyle = '#ffd166';
  ctx.fillText('CLICK / TAP TO START', W / 2, H * 0.8); ctx.globalAlpha = 1;
  ctx.font = `500 ${Math.min(13, W * 0.034)}px ${KFONT}`; ctx.fillStyle = 'rgba(220,210,255,0.7)';
  ctx.fillText('보석을 클릭 두 번 또는 스와이프해서 교환 · P 일시정지 · M 소리', W / 2, H * 0.85);
  if (hi > 0) { ctx.font = `700 13px ${FONT}`; ctx.fillStyle = '#ffd166'; ctx.fillText('BEST  ' + hi.toLocaleString(), W / 2, H * 0.9); }
}

function drawOver() {
  const k = Math.min(1, overT / 0.5);
  ctx.fillStyle = `rgba(8,3,20,${0.7 * k})`; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(W - 40, 380), ph = 330, px = (W - pw) / 2, py = H / 2 - ph / 2;
  const s = easeOutBack(k);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
  ctx.shadowColor = '#b388ff'; ctx.shadowBlur = 40;
  roundRect(px, py, pw, ph, 22); ctx.fillStyle = 'rgba(24,10,56,0.95)'; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#b388ff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 30px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText('RESULT', W / 2, py + 44);
  const cnt = Math.min(1, Math.max(0, (overT - 0.4) / 1));
  ctx.font = `900 46px ${FONT}`; ctx.fillStyle = '#ffd166'; ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 20;
  ctx.fillText(Math.round(score * (1 - Math.pow(1 - cnt, 3))).toLocaleString(), W / 2, py + 112); ctx.shadowBlur = 0;
  ctx.font = `700 15px ${KFONT}`; ctx.fillStyle = '#e0d4ff';
  ctx.fillText(`터뜨린 보석  ${gemsCleared}개`, W / 2, py + 170);
  ctx.fillText(`최대 체인  x${bestChain}   ·   특수 발동  ${specialsUsed}회`, W / 2, py + 198);
  if (newRecord && cnt >= 1) { const p = 1 + Math.sin(clock * 8) * 0.08; ctx.save(); ctx.translate(W / 2, py + 242); ctx.scale(p, p); ctx.font = `900 20px ${FONT}`; ctx.fillStyle = `hsl(${(clock * 300) % 360},100%,65%)`; ctx.fillText('★ NEW RECORD ★', 0, 0); ctx.restore(); }
  if (overT > 1.5) { ctx.globalAlpha = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(clock * 4)); ctx.font = `900 14px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText('TAP TO PLAY AGAIN', W / 2, py + ph - 34); ctx.globalAlpha = 1; }
  ctx.restore();
  if (newRecord && Math.random() < 0.3) addPart(rand(0, W), -10, rand(-40, 40), rand(100, 260), 2, rand(4, 7), COLORS[(Math.random() * KINDS) | 0], 5, 1);
}

function render(rdt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBG();
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  if (state === 'title') { drawTitle(); drawFx(); }
  else { drawBoard(); if (state !== 'over') drawFx(); drawHUD(); }
  ctx.restore();
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.6; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (state === 'play' && timeLeft <= 10 && !timeUp) {
    const p = 0.5 + 0.5 * Math.sin(clock * 10);
    const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,23,68,0)'); g.addColorStop(1, `rgba(255,23,68,${0.15 + p * 0.2})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (state !== 'title') drawBanner(paused ? 0 : rdt);
  if (state === 'over') { drawOver(); ctx.save(); drawFx(); ctx.restore(); }
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(8,3,20,0.65)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 ${Math.min(52, W * 0.1)}px ${FONT}`; ctx.fillStyle = '#fff'; ctx.shadowColor = '#b388ff'; ctx.shadowBlur = 20;
    ctx.fillText('PAUSED', W / 2, H * 0.45); ctx.shadowBlur = 0;
    ctx.font = `500 14px ${KFONT}`; ctx.fillStyle = '#e0d4ff'; ctx.fillText('P 또는 화면 터치로 계속', W / 2, H * 0.45 + 44);
  }
  if (muted) { ctx.font = `700 10px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillText('MUTED', W / 2, H - 8); }
  arcadeLink.style.display = state === 'play' ? 'none' : 'block';
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  const p = paused && state === 'play';
  update(p ? 0 : rdt, p ? 0 : rdt);
  render(rdt);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
