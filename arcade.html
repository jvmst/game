<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#05030f;--fg:#ffffff;--muted:rgba(210,220,255,.7)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:56px 16px 48px}
  h1{font:900 clamp(38px,8vw,84px)/1 Orbitron,sans-serif;text-align:center;margin:0;letter-spacing:.06em}
  h1 span{display:inline-block;animation:bob 2.4s ease-in-out infinite;text-shadow:0 0 18px var(--c),0 0 40px var(--c)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .sub{text-align:center;color:var(--muted);margin:16px 0 44px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
  .card{position:relative;display:block;text-decoration:none;color:inherit;border-radius:20px;padding:14px 14px 18px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);transform-style:preserve-3d;transition:transform .15s ease,box-shadow .25s ease,border-color .25s;opacity:0;animation:rise .7s cubic-bezier(.2,1.4,.4,1) forwards}
  .card:hover,.card:focus-visible{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 18px 60px -10px var(--c);outline:none}
  @keyframes rise{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
  .card canvas{display:block;width:100%;aspect-ratio:16/10;border-radius:12px;background:#0a0620}
  .card h2{font:900 20px Orbitron,sans-serif;margin:14px 4px 4px;letter-spacing:.05em;color:var(--c);text-shadow:0 0 12px var(--c)}
  .card p{margin:0 4px;color:var(--muted);font-size:13.5px;line-height:1.5}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 0;font:700 11px Orbitron,sans-serif;letter-spacing:.08em}
  .best{color:#ffd166}
  .play{padding:6px 12px;border-radius:999px;background:var(--c);color:#05030f}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
  @media (prefers-reduced-motion:reduce){h1 span,.card{animation:none;opacity:1}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <h1 id="logo"></h1>
  <p class="sub">원하는 게임을 골라 플레이하세요 · 기록은 이 브라우저에 저장됩니다</p>
  <div class="grid" id="grid"></div>
  <footer>키보드·마우스·터치 모두 지원 · 각 게임에서 ◀ ARCADE로 돌아올 수 있어요</footer>
</main>
<script>
'use strict';
const GAMES = [
  { href: 'index.html', title: 'NOVA STRIKE', key: 'nova_strike_hi', c: '#7df9ff', desc: '전투기로 적 편대와 거대 전함을 격파하는 세로 슈팅', draw: drawShooter },
  { href: 'breakout.html', title: 'PRISM BREAK', key: 'prism_break_hi', c: '#ff3d7f', desc: '빛의 공으로 프리즘 블록을 산산조각 내는 네온 벽돌깨기', draw: drawBreakout },
  { href: 'runner.html', title: 'NEON DASH', key: 'neon_dash_hi', c: '#ffd166', desc: '점프와 슬라이드로 장애물을 피하며 질주하는 횡스크롤 러너', draw: drawRunner },
  { href: 'match3.html', title: 'GEM CASCADE', key: 'gem_cascade_hi', c: '#b388ff', desc: '60초 안에 보석을 맞춰 연쇄를 터뜨리는 매치3 퍼즐', draw: drawMatch },
];
const LOGO = 'NEON ARCADE', LC = ['#7df9ff', '#ff3d7f', '#ffd166', '#b388ff', '#7CFF6B'];
document.getElementById('logo').innerHTML = [...LOGO].map((ch, i) => ch === ' ' ? ' ' : `<span style="--c:${LC[i % LC.length]};animation-delay:${i * 0.12}s">${ch}</span>`).join('');

const grid = document.getElementById('grid'), cards = [];
GAMES.forEach((g, i) => {
  let best = 0; try { best = +localStorage.getItem(g.key) || 0; } catch (e) {}
  const a = document.createElement('a');
  a.className = 'card'; a.href = g.href; a.style.setProperty('--c', g.c); a.style.animationDelay = (0.1 + i * 0.12) + 's';
  a.innerHTML = `<canvas></canvas><h2>${g.title}</h2><p>${g.desc}</p><div class="meta"><span class="best">BEST ${best.toLocaleString()}</span><span class="play">PLAY ▶</span></div>`;
  grid.appendChild(a);
  const cv = a.querySelector('canvas');
  cards.push({ g, cv, ctx: cv.getContext('2d'), hover: 0, isHover: false });
  a.addEventListener('pointermove', e => {
    const r = a.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    a.style.transform = `perspective(700px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateY(-4px)`;
  });
  a.addEventListener('pointerenter', () => cards[i].isHover = true);
  a.addEventListener('pointerleave', () => { a.style.transform = ''; cards[i].isHover = false; });
});

/* ---------- 공통 그리기 도구 ---------- */
const glowCache = {};
function glow(color) {
  let c = glowCache[color]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.18, color); gr.addColorStop(0.5, color + '55'); gr.addColorStop(1, color + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return glowCache[color] = c;
}
function G(ctx, col, x, y, s) { ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(glow(col), x - s, y - s, s * 2, s * 2); ctx.globalCompositeOperation = 'source-over'; }

/* ---------- 카드 미리보기 애니메이션 ---------- */
function drawShooter(ctx, w, h, t, sp) {
  ctx.fillStyle = '#070316'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) { const x = (i * 97) % w, y = ((i * 53) + t * (40 + (i % 5) * 30) * sp) % h; ctx.fillStyle = `rgba(200,220,255,${0.3 + (i % 3) * 0.2})`; ctx.fillRect(x, y, 1.5, 2 + (i % 4) * sp); }
  const px = w / 2 + Math.sin(t * 1.5) * w * 0.25, py = h * 0.78;
  for (let i = 0; i < 6; i++) { const by = (py - ((t * 260 * sp + i * 40) % (h * 0.8))); G(ctx, '#7df9ff', px - 5, by, 6); G(ctx, '#7df9ff', px + 5, by, 6); }
  for (let i = 0; i < 3; i++) { const ex = w * (0.25 + i * 0.25) + Math.sin(t * 2 + i) * 20, ey = h * 0.25 + Math.cos(t * 1.7 + i) * 10; G(ctx, '#ff4d6d', ex, ey, 16); ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.moveTo(ex, ey + 9); ctx.lineTo(ex + 9, ey - 5); ctx.lineTo(ex - 9, ey - 5); ctx.fill(); }
  const ex = (t * 0.7 % 1); G(ctx, '#ffb347', w * 0.5, h * 0.25, 30 * (1 - ex) * (ex < 0.5 ? 1 : 0));
  G(ctx, '#3fa9ff', px, py + 14, 10 + Math.random() * 4);
  ctx.fillStyle = '#cfe8ff'; ctx.beginPath(); ctx.moveTo(px, py - 14); ctx.lineTo(px + 12, py + 8); ctx.lineTo(px, py + 4); ctx.lineTo(px - 12, py + 8); ctx.fill();
}
function drawBreakout(ctx, w, h, t, sp) {
  ctx.fillStyle = '#060318'; ctx.fillRect(0, 0, w, h);
  const cols = 8, bw = w / cols, cyc = (t * 0.35 * sp) % 1;
  const RC = ['#ff3d7f', '#ffb703', '#3dffa8', '#00e5ff'];
  for (let r = 0; r < 4; r++) for (let c = 0; c < cols; c++) {
    const idx = r * cols + c, gone = (idx * 0.618) % 1 < cyc;
    if (gone) continue;
    ctx.fillStyle = RC[r]; ctx.globalAlpha = 0.9; ctx.fillRect(c * bw + 2, 14 + r * 13, bw - 4, 10); ctx.globalAlpha = 1;
  }
  const bx = w / 2 + Math.sin(t * 2.3 * sp) * w * 0.4, by = h * 0.55 + Math.sin(t * 3.1 * sp) * h * 0.25;
  for (let i = 1; i < 8; i++) { const tt = t - i * 0.02; G(ctx, '#ff3d7f', w / 2 + Math.sin(tt * 2.3 * sp) * w * 0.4, h * 0.55 + Math.sin(tt * 3.1 * sp) * h * 0.25, 9 - i); }
  G(ctx, '#ffffff', bx, by, 10);
  const pX = w / 2 + Math.sin(t * 2.3 * sp) * w * 0.38;
  G(ctx, '#7df9ff', pX, h - 14, 26); ctx.fillStyle = '#7df9ff'; ctx.fillRect(pX - 28, h - 17, 56, 7);
}
function drawRunner(ctx, w, h, t, sp) {
  const sky = ctx.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#1a0838'); sky.addColorStop(1, '#3a0d4a');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
  G(ctx, '#ff3d7f', w * 0.75, h * 0.45, 40);
  for (const [k, col, hh] of [[0.3, '#2a1050', 0.45], [0.7, '#140828', 0.3]]) {
    ctx.fillStyle = col; const off = (t * 80 * k * sp) % 40;
    for (let x = -off; x < w + 40; x += 20) { const bh = h * hh * (0.5 + ((Math.floor((x + t * 80 * k * sp) / 20) * 7) % 5) / 8); ctx.fillRect(x, h * 0.82 - bh, 18, bh); }
  }
  ctx.fillStyle = '#ffd166'; ctx.fillRect(0, h * 0.82, w, 2); G(ctx, '#ffd166', w / 2, h * 0.82, 0);
  const jumpT = (t * 1.2 * sp) % 1, jy = jumpT < 0.5 ? Math.sin(jumpT * 2 * Math.PI / 2 * 2) * h * 0.28 : 0;
  const rx = w * 0.3, ry = h * 0.82 - 16 - Math.max(0, jy);
  for (let i = 1; i < 5; i++) { ctx.globalAlpha = 0.15 * (5 - i); ctx.fillStyle = '#7df9ff'; ctx.fillRect(rx - 6 - i * 8, ry, 12, 16); }
  ctx.globalAlpha = 1; G(ctx, '#7df9ff', rx, ry + 8, 14); ctx.fillStyle = '#ffffff'; ctx.fillRect(rx - 6, ry, 12, 16);
  const ox = w - ((t * 160 * sp) % (w + 40)); ctx.fillStyle = '#ff3d7f'; ctx.fillRect(ox, h * 0.82 - 18, 14, 18); G(ctx, '#ff3d7f', ox + 7, h * 0.82 - 9, 16);
  for (let i = 0; i < 4; i++) { const cx = (w - ((t * 160 * sp + i * 50) % (w + 40))), cy = h * 0.5 + Math.sin(i) * 10; G(ctx, '#ffd166', cx, cy, 8); }
}
function drawMatch(ctx, w, h, t, sp) {
  ctx.fillStyle = '#0d0524'; ctx.fillRect(0, 0, w, h);
  const C = ['#ff3d7f', '#ffb703', '#7CFF6B', '#4cc9f0', '#b388ff', '#ff8c1a'], n = 6, s = Math.min(w, h) / (n + 0.6), ox = (w - s * n) / 2, oy = (h - s * n) / 2;
  const pop = Math.floor(t * 0.8 * sp) % n;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const k = (r * 3 + c * 5 + (r * c)) % 6, x = ox + (c + 0.5) * s, y = oy + (r + 0.5) * s;
    const lit = r === pop && c >= 1 && c <= 3;
    const ph = ((t * 0.8 * sp) % 1), sc = lit ? (ph < 0.5 ? 1 + ph : Math.max(0, 1.5 - (ph - 0.5) * 3)) : 1 + Math.sin(t * 3 + r + c) * 0.04;
    const col = lit ? '#ffffff' : C[k];
    if (lit) G(ctx, C[k], x, y, s * 0.9 * sc);
    ctx.fillStyle = col; ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(Math.PI / 4); ctx.fillRect(-s * 0.26, -s * 0.26, s * 0.52, s * 0.52); ctx.restore();
  }
}

/* ---------- 배경 ---------- */
const bg = document.getElementById('bg'), bctx = bg.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  bg.width = W * DPR; bg.height = H * DPR;
  for (const c of cards) { const r = c.cv.getBoundingClientRect(); c.cv.width = Math.max(1, r.width * DPR); c.cv.height = Math.max(1, r.height * DPR); }
}
addEventListener('resize', resize); resize();
const orbs = Array.from({ length: 26 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: 40 + Math.random() * 120, c: LC[i % LC.length], s: 0.005 + Math.random() * 0.02, p: Math.random() * 6 }));
let t0 = performance.now(), last = t0;
function frame(now) {
  requestAnimationFrame(frame);
  const t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = bctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b0628'); g.addColorStop(1, '#05030f');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  // 원근 그리드
  const hz = H * 0.62; bctx.strokeStyle = 'rgba(179,136,255,0.16)'; bctx.lineWidth = 1;
  for (let i = -14; i <= 14; i++) { bctx.beginPath(); bctx.moveTo(W / 2 + i * 14, hz); bctx.lineTo(W / 2 + i * W * 0.16, H); bctx.stroke(); }
  for (let i = 0; i < 12; i++) { const k = (i + (t * 0.5) % 1) / 12, y = hz + Math.pow(k, 2.2) * (H - hz); bctx.globalAlpha = k; bctx.beginPath(); bctx.moveTo(0, y); bctx.lineTo(W, y); bctx.stroke(); }
  bctx.globalAlpha = 1;
  bctx.globalCompositeOperation = 'lighter';
  for (const o of orbs) { o.y -= o.s * dt; if (o.y < -0.2) o.y = 1.2; bctx.globalAlpha = 0.07 + 0.04 * Math.sin(t + o.p); bctx.drawImage(glow(o.c), o.x * W - o.r, o.y * H - o.r, o.r * 2, o.r * 2); }
  bctx.globalAlpha = 1; bctx.globalCompositeOperation = 'source-over';
  for (const c of cards) {
    c.hover = c.hover + ((c.isHover ? 1 : 0) - c.hover) * Math.min(1, dt * 6);
    const w = c.cv.width / DPR, h = c.cv.height / DPR;
    c.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.ctx.save(); c.g.draw(c.ctx, w, h, t, 1 + c.hover * 1.5); c.ctx.restore();
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
